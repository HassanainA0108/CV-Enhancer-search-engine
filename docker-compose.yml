services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////app/data/app.db
      RESUME_DIRECTORY: /app/resumes
      HF_HOME: /app/model_cache
    volumes:
      - ./data/resumes:/app/resumes:ro
      - backend_data:/app/data
      - model_cache:/app/model_cache
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant
  frontend:
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
volumes:
  qdrant_data:
  backend_data:
  model_cache:
